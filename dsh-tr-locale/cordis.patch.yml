# bundle patch for the dsh-tr-locale language pack plugin: inserts its plugin
# row into the profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); the single row mounts BOTH halves: the
# host half is a no-op (pure browser plugin) and the browser half registers
# the tr language + dictionaries for every covered namespace.
- insert:
    - id: tr-locale
      name: 'dsh-tr-locale'
